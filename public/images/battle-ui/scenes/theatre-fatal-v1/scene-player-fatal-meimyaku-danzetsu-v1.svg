<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 618" role="img" aria-labelledby="title desc">
  <title id="title">Lifeline Cut player fatal scene title insert</title>
  <desc id="desc">An original theatrical black, silver, and crimson fatal title card with a severed life-thread motif.</desc>
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020204" stop-opacity=".2"/>
      <stop offset=".18" stop-color="#070306" stop-opacity=".96"/>
      <stop offset=".5" stop-color="#24060d" stop-opacity=".98"/>
      <stop offset=".82" stop-color="#070306" stop-opacity=".96"/>
      <stop offset="1" stop-color="#020204" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".28" stop-color="#aeb6be"/>
      <stop offset=".55" stop-color="#f4eee8"/>
      <stop offset="1" stop-color="#59606a"/>
    </linearGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3c0008"/>
      <stop offset=".22" stop-color="#ff234b"/>
      <stop offset=".5" stop-color="#8c061d"/>
      <stop offset=".78" stop-color="#ff3456"/>
      <stop offset="1" stop-color="#3c0008"/>
    </linearGradient>
    <radialGradient id="fatalBurst">
      <stop offset="0" stop-color="#ff1642" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#650716" stop-opacity=".1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="redGlow" x="-40%" y="-50%" width="180%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path d="M0 112L298 142H952L1250 112V506L952 476H298L0 506Z" fill="url(#veil)"/>
  <ellipse cx="625" cy="309" rx="420" ry="250" fill="url(#fatalBurst)"/>
  <g opacity=".3" stroke="#d30d38" stroke-width="1">
    <path d="M80 175L483 309L80 443M1170 175L767 309L1170 443"/>
    <path d="M170 154L538 309L170 464M1080 154L712 309L1080 464"/>
  </g>

  <g fill="none">
    <path d="M77 202L216 169H1034L1173 202" stroke="url(#silver)" stroke-width="3"/>
    <path d="M77 416L216 449H1034L1173 416" stroke="url(#silver)" stroke-width="3"/>
    <path d="M218 181H1032M218 437H1032" stroke="url(#blood)" stroke-width="3"/>
  </g>
  <g fill="#07080c" stroke="#cf1738" stroke-width="2">
    <path d="M62 202L96 180L130 202L96 224Z"/>
    <path d="M1188 202L1154 180L1120 202L1154 224Z"/>
    <path d="M62 416L96 394L130 416L96 438Z"/>
    <path d="M1188 416L1154 394L1120 416L1154 438Z"/>
  </g>

  <g font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" text-anchor="middle">
    <text x="625" y="220" fill="#e43b59" font-size="20" font-weight="700" letter-spacing="9">ACT TWO</text>
    <text x="625" y="359" fill="#080105" stroke="#080105" stroke-width="13" font-size="76" font-weight="900" letter-spacing="8" paint-order="stroke">LIFELINE CUT</text>
    <text x="625" y="359" fill="url(#silver)" stroke="#8d071d" stroke-width="3" font-size="76" font-weight="900" letter-spacing="8" paint-order="stroke">LIFELINE CUT</text>
  </g>
  <g filter="url(#redGlow)">
    <path d="M282 389H568" stroke="url(#blood)" stroke-width="3"/>
    <path d="M682 389H968" stroke="url(#blood)" stroke-width="3"/>
    <path d="M568 389L602 377L615 398L634 374L648 397L682 389" fill="none" stroke="#ff3155" stroke-width="3"/>
  </g>
  <g font-family="Georgia,'Times New Roman',serif" text-anchor="middle">
    <text x="625" y="425" fill="#f2d9dc" font-size="17" font-weight="700" letter-spacing="8">PLAYER FATAL</text>
    <text x="625" y="468" fill="#b7828c" font-size="10" letter-spacing="5">THE THREAD FALLS SILENT</text>
  </g>
  <g fill="none" stroke="#9a0c27" opacity=".8">
    <circle cx="160" cy="309" r="45" stroke-width="2" stroke-dasharray="5 7"/>
    <circle cx="1090" cy="309" r="45" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M139 282L181 336M1111 282L1069 336" stroke-width="4"/>
  </g>
</svg>
