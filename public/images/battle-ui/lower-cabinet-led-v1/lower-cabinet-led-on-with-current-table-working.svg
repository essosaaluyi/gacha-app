<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="350" viewBox="0 0 1920 350">
  <title>Lower cabinet LED panel with current 60 degree card table</title>
  <desc>
    Revision base combining the existing active LED panel and current table.
    Placement mirrors the live 1920x1080 cabinet composition.
  </desc>

  <defs>
    <clipPath id="deck-clip" clipPathUnits="userSpaceOnUse">
      <rect width="1920" height="350" />
    </clipPath>
    <clipPath id="table-source-clip" clipPathUnits="userSpaceOnUse">
      <rect x="380" y="0" width="1120" height="350" rx="8" />
    </clipPath>
    <filter id="table-shadow" x="-20%" y="-20%" width="140%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.72" />
    </filter>
  </defs>

  <image
    href="./lower-cabinet-led-on-v1.svg"
    x="0"
    y="0"
    width="1920"
    height="350"
    preserveAspectRatio="none"
  />

  <g clip-path="url(#deck-clip)">
    <g transform="translate(0 -82.5637) scale(1 1.78632)">
      <g clip-path="url(#table-source-clip)" filter="url(#table-shadow)">
        <image
          href="../../cabinet/production/card-table-premium-three-bay.webp"
          x="380"
          y="0"
          width="1120"
          height="420"
          preserveAspectRatio="none"
        />
      </g>
    </g>
  </g>
</svg>
