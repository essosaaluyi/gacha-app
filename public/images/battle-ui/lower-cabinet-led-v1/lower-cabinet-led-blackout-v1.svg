    <rect x="548" y="38" width="118" height="5" rx="2"/>
    <rect x="704" y="38" width="165" height="5" rx="2"/>
    <rect x="897" y="38" width="126" height="5" rx="2"/>
    <rect x="1051" y="38" width="165" height="5" rx="2"/>
    <rect x="1254" y="38" width="118" height="5" rx="2"/>
    <rect x="1404" y="38" width="78" height="5" rx="2"/>
  </g>

