      <path d="M0 12L12 0H57L69 12V43L57 55H12L0 43Z" fill="#030405" stroke="#382f20" stroke-width="2"/>
      <rect x="13" y="16" width="43" height="23" rx="3" fill="#071012" stroke="#172124"/>
      <path d="M18 20H51" stroke="#354044" stroke-width="1" opacity=".45"/>
