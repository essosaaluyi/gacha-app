    <path d="M35 249H215L247 218H329M1885 249H1705L1673 218H1591" stroke="#29251b" stroke-width="5"/>
    <path d="M35 103H184L215 134H327M1885 103H1736L1705 134H1593" stroke="#344344" stroke-width="1"/>
    <path d="M35 249H215L247 218H329M1885 249H1705L1673 218H1591" stroke="#4a4230" stroke-width="1"/>
  </g>

