    <text x="226" y="71" text-anchor="middle" fill="#171b1e" stroke="#373229" stroke-width="1" paint-order="stroke" font-family="Cinzel, Georgia, serif" font-size="34" font-weight="800" letter-spacing="6">DESTINY WARS</text>
    <text x="226" y="92" text-anchor="middle" fill="#252d2f" opacity=".85" font-family="'Share Tech Mono', Consolas, monospace" font-size="9" letter-spacing="5">FATE CIRCUIT / SILENT</text>
