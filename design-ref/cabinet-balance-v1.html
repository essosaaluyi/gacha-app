<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<title>右パネルの割りつけ ― ラフ比較 v1</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* 右パネル（1610,88,270×618）だけを原寸で並べたラフ。寸法は実装の実測値。
   現状の実測（パネル内 px）：DATA 34,28,202×78 ／ AUTO 17,118,237×74
                              ／ DRAW 25,257,221×213 ／ ticker 22,552,226×48 */
:root{
  --gold:#c9a24b; --gold-bright:#efd695; --amber:#ffb648;
  --fu:'Rajdhani','Segoe UI',sans-serif; --fl:'Share Tech Mono',Consolas,monospace;
  --cream1:#fffdf6; --cream2:#f0ead9; --cream3:#dcd4c0; --cream4:#bdb49f;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0d10;color:#dbe3ee;font-family:var(--fu);padding:20px 16px 50px}
h1{text-align:center;font-size:19px;letter-spacing:.12em;font-weight:600}
.lead{text-align:center;font-size:12.5px;opacity:.6;margin:5px 0 20px;line-height:1.75}
.row{display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
figure{margin:0;width:270px}
figcaption{margin-top:9px;font-size:14px;font-weight:700;text-align:center}
.sub{margin-top:3px;font-size:11.5px;line-height:1.65;opacity:.68;text-align:left;min-height:88px}
.bad{color:#ff9a90}.good{color:#8fe3b0}
b{color:#f0e6cc}

/* ── パネルの外枠（全案で共通：外周のクローム見切り1本） ── */
.panel{position:absolute;left:0;top:0;width:270px;height:618px;border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.67),rgba(255,255,255,0) 20%),
             linear-gradient(180deg,#f6f2e8 0%,#e3dccb 16%,#cdc5b1 46%,#b0a894 72%,#8d8676 100%);
  box-shadow:0 0 0 2px #0a0d11,0 0 0 6px #d6cdb4,0 0 0 8px #4a412c,0 0 0 10px #05080b,
             inset 0 2px 0 #fffffcdd,inset 0 -3px 8px #00000040}
.wrap{position:relative;width:270px;height:618px;margin:10px 0 0}
.wide .panel,.wide .wrap{width:330px}
.wide{width:330px}

/* ── 部品 ── */
.sign{position:absolute;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(180deg,#2b323c,#12161c);
  box-shadow:0 0 0 2px #0a0d11,0 0 0 5px #c9d2e2,0 0 0 7px #05080b,inset 0 2px 5px #000a;
  font:800 15px/1 var(--fu);letter-spacing:.12em;color:#c3ccd9;text-shadow:0 1px 0 #000}
.sign i{position:absolute;inset:7px;border-radius:4px;font-style:normal;display:grid;place-items:center;
  background:linear-gradient(180deg,#6d7686,#525b69);color:#0b0d10;font-weight:900;letter-spacing:.1em;
  box-shadow:inset 0 2px 0 #fff6,inset 0 -2px 4px #0006}
.auto{position:absolute;border-radius:7px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:linear-gradient(180deg,#2d333d,#171c23);
  box-shadow:0 0 0 2px #0a0d11,0 0 0 5px #c9d2e2,0 0 0 7px #05080b,inset 0 2px 4px #000a;
  font:700 15px/1 var(--fu);letter-spacing:.16em;color:#dbe2ec}
.auto s{position:relative;width:52px;height:11px;border-radius:6px;background:#05080c;
  box-shadow:inset 0 2px 3px #000;text-decoration:none}
.auto s::after{content:"";position:absolute;left:3px;top:-10px;width:27px;height:27px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#fff,#aeb8c6 46%,#59616e);box-shadow:0 2px 5px #000a}
.draw{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#8d96a6 0 30%,#5b6472 33%,#161b22 36%,#2b323e 44%,#10141b 50%,#3b4252 57%,#20262f 64%,#0a0d12 72%,#05080c 100%);
  box-shadow:0 12px 22px #0008,inset 0 0 18px #000}
.draw::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:62%;height:62%;border-radius:50%;background:repeating-conic-gradient(#eaf4ff 0 5deg,transparent 5deg 22.5deg);
  -webkit-mask:radial-gradient(circle,transparent 0 41%,#000 43% 50%,transparent 52%);
  mask:radial-gradient(circle,transparent 0 41%,#000 43% 50%,transparent 52%);filter:drop-shadow(0 0 5px #dff0ff)}
.draw::after{content:"DRAW";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  font:800 17px/1 var(--fu);letter-spacing:.1em;color:#2f3744;text-shadow:0 1px 0 #ffffff55}
.tray{position:absolute;height:22px;border-radius:4px 4px 12px 12px;
  background:linear-gradient(180deg,#f2f5fa,#aab3bf 42%,#555e6b);box-shadow:0 4px 0 #070b0e,0 7px 9px #0009}
.tick{position:absolute;border-radius:5px;background:#050807;border:2px solid #7f8894;padding:6px 8px;
  font:12px/1.45 var(--fl);color:var(--amber);text-shadow:0 0 6px rgba(255,182,72,.55);
  box-shadow:inset 0 0 20px #000e,0 2px 0 #ffffff99}

/* 寸法の目印 */
.gap{position:absolute;left:0;right:0;z-index:5;pointer-events:none}
.gap::before{content:"";position:absolute;left:5px;right:5px;top:50%;height:1px;background:#ff5a4d88}
.gap em{position:absolute;right:7px;top:50%;transform:translateY(-50%);font:700 10px/1 var(--fl);
  font-style:normal;color:#ff9a90;background:#0b0d10cc;padding:1px 3px;border-radius:2px}
.edge{position:absolute;top:0;bottom:0;width:1px;background:#ff5a4d55;z-index:5}

/* ══ 現状 ══ */
.a .sign{left:34px;top:28px;width:202px;height:78px}
.a .auto{left:17px;top:118px;width:237px;height:74px}
.a .draw{left:65px;top:287px;width:140px;height:140px}
.a .tray{left:14px;right:14px;top:452px}
.a .tick{left:22px;top:552px;width:226px;height:48px}

/* ══ 案 A：割りつけを揃える ══ */
.b .sign{left:20px;top:24px;width:230px;height:78px}
.b .auto{left:20px;top:122px;width:230px;height:74px}
.b .draw{left:40px;top:220px;width:190px;height:190px}
.b .tray{left:20px;right:20px;top:434px}
.b .tick{left:20px;top:482px;width:230px;height:48px}

/* ══ 案 B：表示を上・操作を下 ══ */
.c .sign{left:20px;top:24px;width:230px;height:78px}
.c .tick{left:20px;top:116px;width:230px;height:76px}
.c .auto{left:20px;top:214px;width:230px;height:74px}
.c .draw{left:27px;top:312px;width:216px;height:216px}
.c .tray{left:20px;right:20px;top:552px}

/* ══ 案 C：パネルを 330px に広げる ══ */
.d .sign{left:25px;top:26px;width:280px;height:84px}
.d .auto{left:25px;top:130px;width:280px;height:78px}
.d .draw{left:50px;top:232px;width:230px;height:230px}
.d .tray{left:25px;right:25px;top:486px}
.d .tick{left:25px;top:534px;width:280px;height:56px}
</style></head>
<body>
<h1>右パネルの割りつけ ― ラフ比較 v1</h1>
<p class="lead">右パネル（270 × 618 px）だけを原寸で。寸法は実装の実測値です。<br>
色・質感はラフ。<span class="bad">赤い線</span>＝縦の空き、<span class="bad">赤い縦線</span>＝部品の左右の端。</p>

<div class="row">

  <figure>
    <div class="wrap a"><div class="panel">
      <div class="sign"><i>DATA COUNTER</i></div>
      <div class="auto">AUTO<s></s>OFF</div>
      <div class="draw"></div>
      <div class="tray"></div>
      <div class="tick">&gt; Battle Initialized</div>
      <span class="edge" style="left:17px"></span><span class="edge" style="left:34px"></span>
      <span class="edge" style="left:236px"></span><span class="edge" style="left:254px"></span>
      <div class="gap" style="top:106px;height:12px"><em>12</em></div>
      <div class="gap" style="top:192px;height:95px"><em>95</em></div>
      <div class="gap" style="top:427px;height:125px"><em>125</em></div>
    </div></div>
    <figcaption>現状</figcaption>
    <p class="sub"><span class="bad">●</span> 左右の端が <b>4 種類</b>（左 17/25/34、右 236/246/248/254）。<br>
      <span class="bad">●</span> 縦の空きが <b>12 px と 125 px</b>。DATA と AUTO はくっつき、下は大きく空く。<br>
      <span class="bad">●</span> 丸い DRAW だけ幅が合わず、列の律動が切れる。</p>
  </figure>

  <figure>
    <div class="wrap b"><div class="panel">
      <div class="sign"><i>DATA COUNTER</i></div>
      <div class="auto">AUTO<s></s>OFF</div>
      <div class="draw"></div>
      <div class="tray"></div>
      <div class="tick">&gt; Battle Initialized</div>
      <span class="edge" style="left:20px"></span><span class="edge" style="left:250px"></span>
      <div class="gap" style="top:102px;height:20px"><em>20</em></div>
      <div class="gap" style="top:196px;height:24px"><em>24</em></div>
      <div class="gap" style="top:410px;height:24px"><em>24</em></div>
    </div></div>
    <figcaption>案 A：割りつけを揃える</figcaption>
    <p class="sub"><span class="good">●</span> 全部を <b>x 20–250（幅 230）</b>に揃える。左右の端が 1 本ずつになる。<br>
      <span class="good">●</span> 縦の空きを <b>20 / 24 / 24</b> に統一。<br>
      <span class="good">●</span> 余った分を DRAW に回して <b>140 → 190 px</b>。構造は変えないので直しが軽い。</p>
  </figure>

  <figure>
    <div class="wrap c"><div class="panel">
      <div class="sign"><i>DATA COUNTER</i></div>
      <div class="tick">&gt; Battle Initialized<br>&gt; Round 01 start</div>
      <div class="auto">AUTO<s></s>OFF</div>
      <div class="draw"></div>
      <div class="tray"></div>
      <span class="edge" style="left:20px"></span><span class="edge" style="left:250px"></span>
      <div class="gap" style="top:102px;height:14px"><em>14</em></div>
      <div class="gap" style="top:192px;height:22px"><em>22</em></div>
      <div class="gap" style="top:288px;height:24px"><em>24</em></div>
    </div></div>
    <figcaption>案 B：表示を上・操作を下</figcaption>
    <p class="sub"><span class="good">●</span> 実機と同じ並びに。<b>上＝見るもの</b>（DATA・ログ）、<b>下＝触るもの</b>（AUTO・DRAW）。<br>
      <span class="good">●</span> ログを上へ上げたので下の空白が消え、<b>DRAW を 216 px</b> まで大きくできる。<br>
      <span class="good">●</span> 一番重い物が一番下 ＝ 絵として安定する。</p>
  </figure>

  <figure class="wide">
    <div class="wrap d"><div class="panel">
      <div class="sign"><i>DATA COUNTER</i></div>
      <div class="auto">AUTO<s></s>OFF</div>
      <div class="draw"></div>
      <div class="tray"></div>
      <div class="tick">&gt; Battle Initialized</div>
      <span class="edge" style="left:25px"></span><span class="edge" style="left:305px"></span>
      <div class="gap" style="top:110px;height:20px"><em>20</em></div>
      <div class="gap" style="top:208px;height:24px"><em>24</em></div>
      <div class="gap" style="top:462px;height:24px"><em>24</em></div>
    </div></div>
    <figcaption>案 C：パネルを 330 px に広げる</figcaption>
    <p class="sub"><span class="good">●</span> 270 → <b>330 px</b>。その分、液晶を 1250 → 1190 px に縮める。<br>
      <span class="good">●</span> <b>DRAW が 230 px</b> になり、実機の操作棚の比率にいちばん近い。<br>
      <span class="bad">●</span> 液晶が小さくなる。左列（276 px）とも幅が揃わなくなる。</p>
  </figure>

</div>
<script>
// 4 枚が画面に収まるように全体を縮める（ラフなので比率さえ保てばよい）。
function fit(){
  const row = document.querySelector('.row');
  row.style.transform = 'none'; row.style.width = '';
  const need = 270*3 + 330 + 18*3;            // 4 枚ぶんの幅
  const have = document.documentElement.clientWidth - 24;
  const k = Math.min(1, have / need);
  row.style.width = need + 'px';
  row.style.transform = 'scale(' + k + ')';
  row.style.transformOrigin = '0 0';
  row.style.flexWrap = 'nowrap';
  row.style.margin = '0 auto';
  document.body.style.height = (260 + 760*k) + 'px';
}
addEventListener('resize', fit); addEventListener('load', fit); fit();
document.fonts && document.fonts.ready.then(fit);
</script>
</body></html>
